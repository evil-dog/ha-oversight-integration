send_notification:
  target:
    entity:
      integration: oversight_android_tv_notifications
      domain: notify
  fields:
    message:
      required: true
      example: "Front door motion detected"
      selector:
        text:
    title:
      example: "Security Alert"
      selector:
        text:
    source:
      example: "Home Assistant"
      selector:
        text:
    id:
      example: "front_door"
      selector:
        text:
    image:
      selector:
        text:
    video:
      selector:
        text:
    small_icon:
      example: "mdi:bell"
      selector:
        text:
    small_icon_color:
      example: "#FF5733"
      selector:
        text:
    large_icon:
      example: "mdi:home"
      selector:
        text:
    corner:
      selector:
        select:
          translation_key: corner
          options:
            - "top_start"
            - "top_end"
            - "bottom_start"
            - "bottom_end"
    duration:
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: s
          mode: box
    layout:
      selector:
        object:

send_fixed_notification:
  target:
    entity:
      integration: oversight_android_tv_notifications
      domain: notify
  fields:
    id:
      required: true
      example: "weather_badge"
      selector:
        text:
    visible:
      selector:
        boolean:
    icon:
      example: "mdi:weather-sunny"
      selector:
        text:
    text:
      example: "72°F"
      selector:
        text:
    icon_color:
      example: "#FF5722"
      selector:
        text:
    message_color:
      example: "#FFFFFF"
      selector:
        text:
    background_color:
      example: "#CC333333"
      selector:
        text:
    border_color:
      example: "#FFD700"
      selector:
        text:
    shape:
      selector:
        select:
          translation_key: shape
          options:
            - "circle"
            - "rounded"
            - "rectangular"
    size:
      selector:
        select:
          translation_key: size
          options:
            - "small"
            - "normal"
            - "big"
    expiration:
      example: "1h30m"
      selector:
        text:
    show_duration:
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    collapse_duration:
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    repeat_expand:
      selector:
        boolean:

remove_fixed_notification:
  target:
    entity:
      integration: oversight_android_tv_notifications
      domain: notify
  fields:
    id:
      required: true
      example: "weather_badge"
      selector:
        text:

screen_on:
  target:
    entity:
      integration: oversight_android_tv_notifications
      domain: notify

set_clock_appearance:
  target:
    entity:
      integration: oversight_android_tv_notifications
      domain: notify
  fields:
    font_size:
      selector:
        number:
          min: 1
          max: 100
          mode: box
    font_weight:
      selector:
        select:
          translation_key: font_weight
          options:
            - "thin"
            - "extralight"
            - "light"
            - "normal"
            - "medium"
            - "semibold"
            - "bold"
            - "extrabold"
            - "black"
    color:
      example: "#FFFFFF"
      selector:
        text:
    display_shadow:
      selector:
        boolean:
    background_color:
      example: "#000000"
      selector:
        text:
